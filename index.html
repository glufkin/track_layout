<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Layout</title>
    <style>
      html,body{margin:0;height:100%;overflow:hidden}
      .tl-app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:auto 1fr;
        font:13px system-ui,sans-serif;color:#222;background:#f4f1ea}
      .tl-toolbar{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 8px;
        border-bottom:1px solid #ccc;background:#fbfaf7}
      .tl-toolbar .tl-sep{width:1px;align-self:stretch;background:#ccc;margin:0 4px}
      .tl-toolbar button,.tl-toolbar select{font:inherit;padding:3px 8px}
      .tl-toolbar button[aria-pressed=true]{background:#dbe9fb;border:1px solid #1e88e5;border-radius:3px}
      .tl-toolbar label{display:flex;align-items:center;gap:3px}
      .tl-palette{overflow-y:auto;width:176px;padding:6px;border-right:1px solid #ccc;background:#fbfaf7}
      .tl-palette h3{margin:8px 0 4px;font-size:11px;text-transform:uppercase;color:#666}
      .tl-palette .tl-group{display:grid;grid-template-columns:1fr 1fr;gap:4px}
      .tl-palette .tl-thumb{display:flex;flex-direction:column;align-items:center;padding:2px;border:1px solid #ddd;
        border-radius:4px;background:#fff;cursor:pointer;font-size:10px;text-align:center}
      .tl-palette .tl-thumb:hover{border-color:#1e88e5}
      .tl-palette .tl-thumb.tl-active{border-color:#1e88e5;box-shadow:0 0 0 1px #1e88e5}
      .tl-palette .tl-thumb canvas{width:72px;height:48px}
      .tl-palette .tl-train{display:flex;gap:4px;align-items:center;margin-top:4px}
      .tl-palette .tl-train button{flex:1;font:inherit;padding:4px}
      .tl-palette .tl-train input{width:44px}
      .tl-panel{position:fixed;z-index:10;display:flex;flex-direction:column;gap:4px;min-width:150px;padding:6px 8px;
        font:13px system-ui,sans-serif;color:#222;background:#fbfaf7;border:1px solid #bbb;border-radius:6px;
        box-shadow:0 2px 8px rgba(0,0,0,.2)}
      .tl-panel label{display:flex;align-items:center;justify-content:space-between;gap:6px}
      .tl-panel .tl-panel-row{display:flex;gap:4px}
      .tl-panel button{font:inherit;padding:3px 8px;flex:1}
      .tl-panel input[type=number]{width:48px}
      .tl-panel input[type=range]{width:96px}
      .tl-canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;touch-action:none;outline:none}
      .tl-canvas.tl-sketch{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M3 21l1.5-5.5L16 4l4 4L8.5 19.5z' fill='%23fff' stroke='%23222' stroke-width='1.5' stroke-linejoin='round'/><path d='M14 6l4 4' stroke='%23222' stroke-width='1.5'/><path d='M3 21l1.5-5.5 4 4z' fill='%23222'/></svg>") 3 21,crosshair}
      .tl-canvas.tl-sketch.tl-refused{cursor:not-allowed}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
